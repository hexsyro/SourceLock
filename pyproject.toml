[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sourcelock"
version = "0.1.0"
description = "Verify AI-generated claims against source text: TF-IDF cosine similarity, negation-aware gating, and traceable findings."
readme = "README.md"
license = "MIT"
authors = [{ name = "hexsyro", email = "hexsyro@gmail.com" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["ai", "hallucination", "claim-verification", "data-quality", "nlp", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sourcelock = "sourcelock.cli:main"

[project.urls]
Homepage = "https://github.com/hexsyro/SourceLock"
Repository = "https://github.com/hexsyro/SourceLock"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
